[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "school-scheduler"
version = "0.1.0"
description = "A Python tool for generating school timetables using constraint programming."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.15,<10",
]
[tool.setuptools.packages.find]
where = ["src"]
